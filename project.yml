name: AirliveBridge
options:
  bundleIdPrefix: studio.airlive.bridge
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

# Sparkle — seamless auto-update framework (download → verify EdDSA → replace in
# place → relaunch).  Updates are signed with an EdDSA key (private in the Keychain,
# public in Info.plist SUPublicEDKey); the app checks the appcast at SUFeedURL.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.0"

targets:
  AirliveBridge:
    type: application
    platform: macOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Airlive Bridge
        # Single version source: MARKETING_VERSION (settings below).  Substituted by
        # Xcode at build; the window title reads it via CFBundleShortVersionString.
        # MUST live here, not as a hand-edit to the plist (xcodegen wipes those).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Build number Sparkle COMPARES to decide "is there a newer build" (NOT the
        # marketing string).  Driven by CURRENT_PROJECT_VERSION (settings.base) so it
        # lives in one place; MUST strictly increment every release and MUST equal the
        # appcast item's sparkle:version.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # --- Sparkle auto-update ---
        # Appcast feed — the appcast.xml at this repo's ROOT, served free and
        # permanently by GitHub raw.  Baked into every shipped build and can NEVER
        # change (a later change orphans older installs), so the file must never be
        # moved/renamed.  The big .dmg is served by GitHub Releases (enclosure url).
        # (History: 1.0.0 shipped pointing at airlive.studio, which was never stood
        # up — those installs update manually; 1.0.1+ use this working feed.)
        SUFeedURL: "https://raw.githubusercontent.com/airlive-project/airlive-bridge/main/appcast.xml"
        # base64 Ed25519 PUBLIC key from `generate_keys` (44 chars, ends "=").  The
        # private key stays in the login Keychain, NEVER committed.  PLACEHOLDER until
        # generate_keys is run — package.sh REFUSES to ship a release while this is the
        # placeholder (a build with no real key has no update-trust anchor).
        SUPublicEDKey: "ie+HJccb8B+1CeZ6PRMIjDD3neKGtIpk8SvPhFQqdN4="
        # Scheduled background update checks: ON since 1.0.0 re-ship (2026-07-15).
        # The gate that kept this off — "prove the signing pipeline end-to-end
        # first" — is satisfied: builds are Developer-ID signed + notarized +
        # stapled, and SUPublicEDKey is the real generate_keys value, so Sparkle
        # verifies both Apple's signature and our EdDSA on every update.
        SUEnableAutomaticChecks: true
        # Points the Dock/Finder at the asset-catalog AppIcon.  MUST live here: xcodegen
        # regenerates Sources/Info.plist from these properties, so a hand-edit to the plist
        # is wiped on the next `xcodegen` — which is why the icon never stuck before.
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "13.0"
        # A video-production / broadcast tool → the Video category in Finder / Spotlight.
        LSApplicationCategoryType: "public.app-category.video"
        # About panel + Get Info.  Set the real legal entity if it's not just "Airlive".
        NSHumanReadableCopyright: "Copyright © 2026 Airlive. All rights reserved."
        # Local-network access is needed twice: to receive the iPhone stream
        # (_airlive._tcp) AND for NDI's mDNS discovery (_ndi._tcp) — without the
        # NDI service type declared, macOS can block the NDI source from being
        # discovered by receivers like OBS/DistroAV.
        NSLocalNetworkUsageDescription: "Airlive Bridge uses the local network to find and receive video from Airlive Camera, and to republish it to receivers such as OBS and NDI."
        # Capturing a UVC/HDMI capture card (the "HDMI / USB Capture" source) goes
        # through AVFoundation, which needs the camera-access usage string + grant.
        NSCameraUsageDescription: "Airlive Bridge needs camera access to capture video from a connected HDMI or USB capture device (such as a capture card)."
        NSBonjourServices:
          - _airlive._tcp
          - _ndi._tcp
          # AirPlay Screen Mirroring receiver advertises as an Apple TV.
          - _airplay._tcp
          - _raop._tcp
    # System frameworks for the AirPlay receiver's VideoToolbox decode path.
    dependencies:
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - package: Sparkle   # auto-update (see packages: above)
      # Bundled system extension — macOS loads it from Contents/Library/SystemExtensions
      # and ONLY when the app itself lives in /Applications.
      - target: AirliveVirtualCamera
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: Airlive Bridge
        MARKETING_VERSION: "1.1.0"   # semver: MAJOR.MINOR.PATCH — bump like a real release train
        # Sparkle's compare key (→ CFBundleVersion).  Strictly increment EVERY release
        # (1 → 2 → 3 …) and mirror it in the appcast item's sparkle:version.
        CURRENT_PROJECT_VERSION: "9"
        SWIFT_VERSION: "5.9"
        # Apple Silicon only — the vendored UxPlay/openssl/libplist static libs are arm64.
        # A bare `ARCHS: arm64` gets DROPPED by xcodegen (never lands in the pbxproj), so an
        # Xcode build with ONLY_ACTIVE_ARCH=NO also targets x86_64 and the link fails with
        # "Undefined symbol _raop_* / _dnssd_*" (arm64 libs ignored for the x86_64 slice).
        # EXCLUDED_ARCHS reliably lands and forces an arm64-only link in BOTH Debug & Release.
        ARCHS: "arm64"
        EXCLUDED_ARCHS: x86_64
        ONLY_ACTIVE_ARCH: "NO"
        # App icon (populate the .appiconset with scripts/make-icon.sh once the
        # logo PNG exists; an empty set just builds without an icon meanwhile).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Notarized-distribution requirements (used by scripts/package.sh; harmless
        # for unsigned debug builds, which pass CODE_SIGNING_ALLOWED=NO):
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: AirliveBridge.entitlements
        # Stable signing identity (David Evsyukov Personal Team) — REQUIRED for macOS
        # Local Network privacy: an ad-hoc-signed app can't be granted Local Network,
        # so Bonjour PUBLISHING (Airlive channels + AirPlay _raop/_airplay) is denied
        # (-65555 / -72008). A real Team gives TCC a stable identity to grant + persist.
        DEVELOPMENT_TEAM: XWBJP49FTR
        CODE_SIGN_STYLE: Automatic
        # --- AirPlay receiver (Sources/AirPlay + vendored UxPlay static libs) ---
        # Build the libs first: scripts/build-airplay-lib.sh (brew cmake openssl@3 libplist).
        CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/AirliveBridge-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Vendor/airplay-lib/include
          # openssl + libplist headers, from our macOS-13 source build (scripts/build-deps.sh)
          - $(SRCROOT)/Vendor/deps/include
        OTHER_LDFLAGS:
          - $(SRCROOT)/Vendor/airplay-lib/lib/libairplay.a
          - $(SRCROOT)/Vendor/airplay-lib/lib/libplayfair.a
          - $(SRCROOT)/Vendor/airplay-lib/lib/libdnssd.a
          - $(SRCROOT)/Vendor/airplay-lib/lib/libllhttp.a
          # libcrypto + libplist rebuilt at min-macOS 13 (NOT Homebrew's host-OS build)
          # so the link is warning-clean and the app runs on every supported macOS.
          - $(SRCROOT)/Vendor/deps/lib/libcrypto.a
          - $(SRCROOT)/Vendor/deps/lib/libplist-2.0.a

  # ── Virtual Camera ────────────────────────────────────────────────────────────
  # A CoreMediaIO camera extension: a separate process macOS launches when any app
  # opens the camera, so Zoom / Meet / QuickTime see "Airlive Bridge Virtual Camera" whether
  # or not the Bridge happens to be running.  It reads program frames from the shared
  # App Group slot and shows a spoken-for placeholder when there is nothing on air.
  AirliveVirtualCamera:
    type: system-extension
    platform: macOS
    sources:
      - VirtualCamera
    info:
      path: VirtualCamera/Info.plist
      properties:
        CFBundleDisplayName: Airlive Bridge Virtual Camera
        # SYSX is how macOS RECOGNISES this bundle as a system extension.  xcodegen does
        # not add it for the system-extension product type, and without it the OS does not
        # see an extension here at all: activation fails with "extension not found" while
        # the bundle sits in Contents/Library/SystemExtensions with a perfectly good
        # identifier and signature.  (Apple's own extensions all carry it — compare any
        # shipping .systemextension.)
        CFBundlePackageType: SYSX
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "13.0"
        # Shown by macOS in the approval prompt the operator confirms once.
        NSSystemExtensionUsageDescription: "Airlive Bridge installs a virtual camera so other apps can use the program feed as a webcam."
        # How CoreMediaIO reaches the extension.  The TeamID prefix is REQUIRED — the
        # service name must be unique across every extension on the machine.
        CMIOExtension:
          CMIOExtensionMachServiceName: $(TeamIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
        # Identity of the device and its two streams.  The DEVICE uuid is the contract with
        # the app (it matches on it to find us) and anchors the user's camera permission —
        # it must never change across releases.
        AirliveCameraDeviceUUID: 6F1B7A54-2C3E-4B7E-9E4D-A1C0D2E3F4A5
        AirliveCameraSourceUUID: 3A2B1C0D-4E5F-4A6B-8C7D-9E0F1A2B3C4D
        AirliveCameraSinkUUID: 5C4D3E2F-1A0B-4C9D-8E7F-6A5B4C3D2E1F
    settings:
      base:
        # The bundle, its executable and its identifier must all be THE SAME STRING.
        # macOS resolves a system extension inside Contents/Library/SystemExtensions by
        # its identifier, so a bundle named anything else is simply not found — the
        # activation request fails with "extension not found" while the extension sits
        # right there, correctly signed. Every shipping camera extension follows this
        # (compare OBS's com.obsproject.obs-studio.mac-camera-extension.systemextension).
        PRODUCT_NAME: studio.airlive.bridge.AirliveBridge.vcam
        PRODUCT_BUNDLE_IDENTIFIER: studio.airlive.bridge.AirliveBridge.vcam
        # These MUST be declared on THIS target.  They were written as
        # $(MARKETING_VERSION)/$(CURRENT_PROJECT_VERSION) in the info block, but those are
        # defined on the APP target only — here they expanded to nothing and both version
        # keys silently vanished from the extension's Info.plist.  macOS stages and
        # compares system extensions BY VERSION, so a version-less extension can never be
        # staged: activation fails with "extension not found" while the bundle sits in
        # place, correctly named and signed.  Kept equal to the app's so an update is
        # recognised as newer.
        MARKETING_VERSION: "1.1.0"
        # Kept EQUAL to the app's, so the pair moves together and only on a real release.
        CURRENT_PROJECT_VERSION: "9"
        SWIFT_VERSION: "5.9"
        ARCHS: "arm64"
        EXCLUDED_ARCHS: x86_64
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: VirtualCamera/AirliveVirtualCamera.entitlements
        DEVELOPMENT_TEAM: XWBJP49FTR
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
    # The extension's build number is the APP's build number, and changes only when we ship
    # a new one.
    #
    # It used to be a fresh `date +%s` on every build, so that a development rebuild would
    # always outrank the staged copy. That reasoning is sound and the cost is not: macOS
    # REPLACES a staged extension whose version rose, which tears down its process and
    # unpublishes the camera, and defers removing the outgoing copy until the next restart.
    # So every single build — including one that changed nothing in the extension at all —
    # cost a restart and left the camera missing until it happened. Three builds in one
    # afternoon left three staged copies and no camera. For users it would be worse: an
    # update that only touched app code would still take their camera away until they rebooted.
    #
    # Tied to the app's build number, an unchanged extension reports an unchanged version, and
    # SystemExtensionInstaller answers `.cancel` — nothing is replaced, nothing is torn down,
    # nothing waits for a restart. Shipping a real change means bumping CURRENT_PROJECT_VERSION,
    # which is a deliberate, visible act, exactly as it should be. When iterating ON the
    # extension itself, bump it to see your change.

schemes:
  AirliveBridge:
    build:
      targets:
        AirliveBridge: all
    run:
      config: Debug
    archive:
      config: Release

# Dependencies added per phase, not up front:
#   - HaishinKit (RTMP/SRT output) — phase 3
#   - NDI SDK (xcframework / system lib) — phase 2
#   - RTSP muxer — phase 3
# The wire format (AirlivePacket/PacketParser/ControlMessage/StateSnapshot) is a
# standalone COPY under Sources/Wire (never references the airlive repo directly).
